<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Junkbox 2.0</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .amber { fill: var(--amber); }
  .deep { fill: var(--text); }
  .sunk { fill: var(--surface-sunk); }
  .rib { fill: var(--surface); }
  .rib-dark { fill: var(--amber); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-hand); font-weight: 400; font-size: 112px; line-height: .95; letter-spacing: .03em; -webkit-text-stroke: .02em currentColor; color: var(--text); }
  .tag { margin: var(--space-3) 0 0 4px; font: 500 12px/20px var(--font-sans); letter-spacing: .4em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      amber 224×256 bleeding off the top (the logo tile, largest) · text-ink 192×176 bleeding off the right (ink in Light, light in Dark so it never sinks into the ground) · surface-sunk 96×64 for relief — about 35% of 960×288
  arrangement one tall amber slab and a dark slab stepping right, bottoms on one line space-8 above the edge, space-4 gutter
  pattern     the bin's vertical ribs from the logo: seven ground-coloured slats cut into the amber slab and five amber slats on the dark slab, both at a space-6 pitch
  scales      sides in space-4 multiples; gutter space-4; pitch space-6 (24); slat width space-2 (8) with rx 4, half its width; blocks radius-none, square like the logo tile
-->
<rect class="amber" x="16" y="-16" width="224" height="272"/>
<rect class="rib" x="48" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="72" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="96" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="120" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="144" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="168" y="96" width="8" height="128" rx="4"/>
<rect class="rib" x="192" y="96" width="8" height="128" rx="4"/>
<rect class="sunk" x="256" y="16" width="96" height="64"/>
<rect class="deep" x="256" y="96" width="240" height="160"/>
<rect class="rib-dark" x="288" y="128" width="8" height="96" rx="4"/>
<rect class="rib-dark" x="312" y="128" width="8" height="96" rx="4"/>
<rect class="rib-dark" x="336" y="128" width="8" height="96" rx="4"/>
<rect class="rib-dark" x="360" y="128" width="8" height="96" rx="4"/>
<rect class="rib-dark" x="384" y="128" width="8" height="96" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Junkbox 2.0</h1>
<p class="tag">Cafe &amp; fast food</p>
</div>
</div>
</body>
</html>
