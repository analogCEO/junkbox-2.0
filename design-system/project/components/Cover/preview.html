<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Junkbox 2.0</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .amber { fill: var(--amber); }
  .deep { fill: var(--text); }
  .kraft { fill: var(--kraft); }
  .pickle { fill: var(--pickle); }
  .chili { fill: var(--chili); }
  .ground { fill: var(--surface); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: .95; letter-spacing: -.01em; color: var(--text); }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      amber 240×240 (the brand, largest) · text-ink 208×160 bleeding off the right (ink in Light; flips to on-ink cream in Dark so it never vanishes into the ink ground) · kraft 112×64 (packaging) · pickle 48×48 once (fresh) · chili only as three heat pills — about 40% of 960×288
  arrangement one amber slab with satellites stepping right, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     the bite: three ground-coloured teeth (circle r = space-4, set by the bite formula) cut from the top-right corner of the amber slab and the kraft box, the brand's one device; chili as the heat meter's three pills on the deep block
  scales      sides in space-4 multiples; gutters space-4; blocks radius-md (12), pickle radius-sm (4), pills rx = half of 8 (radius-pill)
-->
<rect class="amber" x="16" y="16" width="240" height="240" rx="12"/>
<circle class="ground" cx="231.2" cy="13.6" r="16"/>
<circle class="ground" cx="247.2" cy="24.8" r="16"/>
<circle class="ground" cx="258.4" cy="40.8" r="16"/>
<rect class="kraft" x="272" y="16" width="112" height="64" rx="12"/>
<circle class="ground" cx="371.6" cy="14.5" r="10"/>
<circle class="ground" cx="381.6" cy="21.5" r="10"/>
<circle class="ground" cx="388.6" cy="31.5" r="10"/>
<rect class="pickle" x="400" y="32" width="48" height="48" rx="4"/>
<rect class="deep" x="272" y="96" width="224" height="160" rx="12"/>
<rect class="chili" x="296" y="224" width="32" height="8" rx="4"/>
<rect class="chili" x="336" y="224" width="32" height="8" rx="4"/>
<rect class="chili" x="376" y="224" width="32" height="8" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Junkbox<br>2.0</h1>
<p class="tag">Street food with a fighter's name.</p>
</div>
</div>
</body>
</html>
